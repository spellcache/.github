name: Bug report
description: Something does not work as expected.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search existing issues first.
        **Security issues must not be reported here** — see the security policy.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Tap …
        3. See …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in Settings › About, or the image tag you run.
      placeholder: e.g. 1.2.3
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation
      options:
        - docker-compose.example.yml (GHCR images)
        - Built from source
        - Development (pnpm dev)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. iPhone 15, Safari 18 (installed app) / Windows, Firefox 131
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output of `docker compose logs web worker`, or browser console errors. Remove any secret.
      render: shell
